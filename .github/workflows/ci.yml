name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core tests (Python ${{ matrix.python }}, no dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite with only the standard library
        run: python -m unittest discover -s tests -t . -v

  integrations:
    name: integrations (all extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[all,dev]"
      - run: python -m pytest -q
      - run: python -m personalines --help
